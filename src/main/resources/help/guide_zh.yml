title: ErrorShop 中文用户指南
content:
  - "ErrorShop 是一个免费商店插件，包含官方商店、全球市场和自定义菜单。"
  - "官方商店：管理员编辑 shops 文件夹中的配置文件，玩家使用 /errorshop shop <名称> 打开。"
  - "全球市场：玩家手持物品执行 /errorshop sell <价格> 上架，使用 /errorshop market [关键词] 浏览或搜索；卖家右键两次自己的商品可确认下架。"
  - "背包满时，购买或下架返还的物品会安全暂存；清出空间后使用 /errorshop claim 手动领取。"
  - "自定义菜单：管理员编辑 menus 文件夹中的配置文件，通过 /errorshop menu <名称> 打开。"
  - "主要配置在 config.yml，数据库/存储配置在 database.yml，所有提示文本在 lang.yml。"
  - "如果要启用真实经济，请安装 Vault 和经济插件，并把 config.yml 的 currency.provider 设置为 vault。"
  - "market.tax-rate 控制市场税率；min-price、max-price 和 price-decimals 控制合法价格。"
