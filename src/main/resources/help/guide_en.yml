title: EasyShop English User Guide
content:
  - "EasyShop is a free shop plugin with official shops, a global player market, and custom menus."
  - "Official shops: edit files in the shops folder, then use /easyshop shop <id>."
  - "Global market: hold an item and run /easyshop sell <price>; other players buy with /easyshop market."
  - "Custom menus: edit files in the menus folder, then use /easyshop menu <id>."
  - "Main settings are in config.yml, storage/database settings are in database.yml, and all messages are in lang.yml."
  - "To enable real economy, install Vault and an economy plugin, then set currency.provider to vault in config.yml."
