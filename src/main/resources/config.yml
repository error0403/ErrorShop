settings:
  default-shop: default
  default-menu: main
currency:
  # none: no real money deduction/payment, for preview and testing
  # vault: use Vault economy when Vault is installed
  provider: none
market:
  # Permission-based listing limits. If a player matches multiple groups, the largest slots value is used.
  groups:
    default:
      slots: 9
    vip:
      permission: "errorshop.market.vip"
      slots: 18
    svip:
      permission: "errorshop.market.svip"
      slots: 27
  tax-rate: 0.0
  max-listings-per-player: 20
  return-items-on-shutdown: false
shop:
  close-after-purchase: false
menu:
  allow-console-actions: true

points:
  enabled: false
  provider: playerpoints
  name: 点券


# Cluster/group-server support. Disabled by default to keep single-server setup simple.
cluster:
  enabled: false
  group: "default"
  server-id: "survival-1"
  redis:
    enabled: false
    host: "localhost"
    port: 6379
    password: ""
    database: 0
    channel: "errorshop:market"
