storage:
  # yaml: zero dependency local storage; sqlite: reserved for future release
  type: yaml
  yaml:
    # Relative paths are resolved under the plugin data folder.
    file: market.yml
  sqlite:
    file: market.db


# Future cluster market storage. Current 0.15 keeps local YAML backend by default; MySQL backend will use these settings.
cluster-market:
  enabled: false
  table-prefix: "errorshop_"
