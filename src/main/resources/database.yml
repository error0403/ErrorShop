storage:
  # yaml: zero dependency local storage; sqlite: reserved for future release
  type: yaml
  yaml:
    # Relative paths are resolved under the plugin data folder.
    file: market.yml
  sqlite:
    file: market.db


# Future cluster market storage. Current local YAML backend by default; MySQL backend will use these settings.
cluster-market:
  enabled: false
  table-prefix: "errorshop_"


mysql:
  host: "localhost"
  port: 3306
  database: "errorshop"
  username: "root"
  password: ""
  table-prefix: "errorshop_"
  use-ssl: false
