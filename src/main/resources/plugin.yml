name: ErrorShop
main: com.pixelserver.errorshop.ErrorShopPlugin
version: 0.18.1
authors: [PixelServer]
api-version: '1.21'
folia-supported: true
softdepend: [Vault, XConomy, PlaceholderAPI, PlayerPoints]
commands:
  errorshop:
    description: ErrorShop main command
    usage: /errorshop <reload|shop|market [search]|sell|claim|menu>
    aliases: [eshop]
permissions:
  errorshop.reload:
    default: op
  errorshop.market.sell:
    default: true
  errorshop.market.buy:
    default: true
  errorshop.market.cancel:
    default: true
  errorshop.market.claim:
    default: true
  errorshop.shop.default:
    default: true
  errorshop.menu.main:
    default: true

